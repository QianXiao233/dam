    <script>
        // ========== 弹窗 JS 函数（新增） ==========
        function showConfirmDialog(title, message, onConfirm) {
            const modal = document.getElementById('confirmModal');
            const titleEl = document.getElementById('confirmTitle');
            const msgEl = document.getElementById('confirmMessage');
            const okBtn = document.getElementById('confirmOkBtn');
            
            if (!modal) return;
            
            titleEl.innerText = title || '⚠️ 警告';
            msgEl.innerHTML = message || '确认执行此操作吗？';
            
            // 移除旧监听，避免重复绑定
            const newBtn = okBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newBtn, okBtn);
            
            newBtn.onclick = () => {
                modal.classList.remove('active');
                if (typeof onConfirm === 'function') {
                    onConfirm();
                }
            };
            
            modal.classList.add('active');
            
            // 点击遮罩关闭（不触发回调）
            modal.onclick = (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            };
        }

    // 点击视频放大的功能
    document.addEventListener('DOMContentLoaded', function() {
        // 获取所有需要点击放大的视频元素
        const videoElements = [
            document.getElementById('video_feed_01'),
            document.getElementById('video_feed_02'),
            document.getElementById('video_feed_03'),
            document.querySelectorAll('#video_feed') // 如果有多个相同ID的元素
        ];
        
        // 创建遮罩层（用于放大显示）
        function createModalOverlay() {
            // 检查是否已存在遮罩层
            let overlay = document.getElementById('videoModalOverlay');
            if (overlay) {
                return overlay;
            }
            
            // 创建遮罩层
            overlay = document.createElement('div');
            overlay.id = 'videoModalOverlay';
            overlay.style.cssText = `
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.9);
                z-index: 10000;
                cursor: pointer;
                justify-content: center;
                align-items: center;
            `;
            
            // 创建放大后的图片容器
            const modalContent = document.createElement('div');
            modalContent.style.cssText = `
                position: relative;
                max-width: 90%;
                max-height: 90%;
            `;
            
            // 创建放大后的图片
            const modalImg = document.createElement('img');
            modalImg.id = 'modalImage';
            modalImg.style.cssText = `
                width: 100%;
                height: 100%;
                object-fit: contain;
                border-radius: 10px;
                box-shadow: 0 0 20px rgba(0,0,0,0.5);
            `;
            
            // 创建关闭按钮
            const closeBtn = document.createElement('button');
            closeBtn.innerHTML = '✕';
            closeBtn.style.cssText = `
                position: absolute;
                top: -40px;
                right: -40px;
                background: white;
                border: none;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                font-size: 24px;
                cursor: pointer;
                color: #333;
                transition: all 0.3s;
            `;
            closeBtn.onmouseover = () => closeBtn.style.background = '#f0f0f0';
            closeBtn.onmouseout = () => closeBtn.style.background = 'white';
            
            modalContent.appendChild(modalImg);
            modalContent.appendChild(closeBtn);
            overlay.appendChild(modalContent);
            
            // 点击遮罩层关闭
            overlay.onclick = function(e) {
                if (e.target === overlay) {
                    overlay.style.display = 'none';
                }
            };
            
            // 点击关闭按钮关闭
            closeBtn.onclick = function() {
                overlay.style.display = 'none';
            };
            
            document.body.appendChild(overlay);
            return overlay;
        }
        
        // 为单个视频元素添加点击放大功能
        function addZoomFunctionality(element) {
            if (!element) return;
            
            element.style.cursor = 'pointer';
            element.addEventListener('click', function(e) {
                e.stopPropagation();
                const overlay = createModalOverlay();
                const modalImg = document.getElementById('modalImage');
                
                // 设置放大显示的图片源
                modalImg.src = this.src;
                overlay.style.display = 'flex';
                
                // ESC键关闭
                const escHandler = function(e) {
                    if (e.key === 'Escape') {
                        overlay.style.display = 'none';
                        document.removeEventListener('keydown', escHandler);
                    }
                };
                document.addEventListener('keydown', escHandler);
            });
        }
        
        // 为所有视频元素添加点击功能
        // 方式1：通过ID添加
        const video1 = document.getElementById('video_feed_01');
        const video2 = document.getElementById('video_feed_02');
        const video3 = document.getElementById('video_feed_03');
        
        addZoomFunctionality(video1);
        addZoomFunctionality(video2);
        addZoomFunctionality(video3);
        
        // 方式2：为所有 class 为 l01, l02, l03 的元素添加
        document.querySelectorAll('.l01, .l02, .l03').forEach(img => {
            addZoomFunctionality(img);
        });
        
        // 方式3：为所有视频相关的图片添加
        document.querySelectorAll('img[id*="video_feed"]').forEach(img => {
            addZoomFunctionality(img);
        });
        
        console.log('视频放大功能已启用');
    });
